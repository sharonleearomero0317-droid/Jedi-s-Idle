<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jedi's Idle — Sprout Farm v1.0.0</title><style>
body{margin:0;font:16px system-ui;color:#efffe9;background:linear-gradient(135deg,#082d20,#17643b,#0b3b28)}.app{max-width:1100px;margin:auto;padding:14px}.top,.panel{background:linear-gradient(140deg,#1c6540,#10432c);border:1px solid #43885a;border-radius:16px;padding:16px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.nav,.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:10px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,#c4f0aa,#6bc77c);color:#133d28;font-weight:800;cursor:pointer}.nav button{background:#10452d;color:#efffe9;border:1px solid #438457}.nav .active{background:#b9eca2;color:#133d28}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card,.row{padding:14px;background:#0d3b28;border:1px solid #43885a;border-radius:13px}.map{position:relative;height:360px;min-width:560px;background-color:#91ce7b;background-image:radial-gradient(#4d995a66 1.5px,transparent 1.5px);background-size:28px 28px;border-radius:14px;overflow:hidden}.mapwrap{overflow:auto}.building{position:absolute;width:190px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:4px solid #754b2c;border-radius:15px;background:linear-gradient(#b77945 0 25%,#e4b86d 25%);color:#fff8dd;box-shadow:0 8px 0 #245a35}.shop{left:10%;top:15%}.green{right:10%;bottom:10%;background:linear-gradient(#5ba9a1 0 30%,#b8edce 30%);border-color:#286c55;color:#144331}.emoji{font-size:32px}.plotgrid{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:9px}.plot{text-align:center;padding:10px;background:#155536;border:2px solid #5b9c62;border-radius:12px;display:grid;justify-items:center;gap:7px;min-height:120px}.muted{color:#c2e5bf;font-size:13px}.price{color:#f5d879;font-weight:bold}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.grow{flex:1}.notice{padding:10px;background:#d3f5b4;color:#17442a;border-radius:10px;margin-bottom:10px}@media(max-width:650px){.plotgrid{grid-template-columns:repeat(2,1fr)}.building{width:150px;height:125px}}
</style></head><body><div class="app"><header class="top"><div><b style="font-size:22px">🌱 JEDI'S IDLE</b><div class="muted">SPROUT FARM · VERSION 1.0.0</div></div><div>Cash: <b id="cash">$100</b> · Seeds: <b id="seeds">2</b> · Harvest: <b id="harvest">0</b></div></header><nav class="nav"><button data-tab="home">🌳 Farm</button><button data-tab="market">🛒 Seed Market</button><button data-tab="greenhouse">🏡 Greenhouse</button><button data-tab="inventory">🎒 Inventory</button><button data-tab="updates">📋 Update Log</button><button data-tab="credits">⭐ Credits</button></nav><main class="panel" id="panel"></main><p class="muted">Progress saves automatically in this browser.</p></div>
<script>
var crops=[{id:"carrot",name:"Carrot",e:"🥕",price:5,value:12,time:12},{id:"lettuce",name:"Lettuce",e:"🥬",price:8,value:18,time:22},{id:"tomato",name:"Tomato",e:"🍅",price:12,value:28,time:35},{id:"corn",name:"Corn",e:"🌽",price:18,value:43,time:50},{id:"pumpkin",name:"Pumpkin",e:"🎃",price:25,value:65,time:75}];
function fresh(){return {cash:100,seeds:{carrot:2,lettuce:0,tomato:0,corn:0,pumpkin:0},harvest:{carrot:0,lettuce:0,tomato:0,corn:0,pumpkin:0},plots:Array(10).fill(null),tab:"home"}}
var game;try{game=Object.assign(fresh(),JSON.parse(localStorage.getItem("jediIdleFarmSave")||"{}"));game.seeds=Object.assign(fresh().seeds,game.seeds);game.harvest=Object.assign(fresh().harvest,game.harvest);if(!game.plots||game.plots.length!==10)game.plots=fresh().plots}catch(e){game=fresh()}
var selected="carrot",notice="";function el(id){return document.getElementById(id)}function get(id){return crops.find(function(c){return c.id===id})||crops[0]}function sum(o){return Object.values(o).reduce(function(a,b){return a+b},0)}function save(){localStorage.setItem("jediIdleFarmSave",JSON.stringify(game))}function go(tab){game.tab=tab;save();draw()}function head(a,b,btn){return '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h1>'+a+'</h1><p class="muted">'+b+'</p></div>'+(btn||"")+'</div>'}
function draw(){el("cash").textContent="$"+game.cash;el("seeds").textContent=sum(game.seeds);el("harvest").textContent=sum(game.harvest);document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("active",b.dataset.tab===game.tab)});var h=notice?'<div class="notice">'+notice+'</div>':"";notice="";
if(game.tab==="home"){h+=head("Welcome to Sprout Farm","Buy seeds, grow crops, and sell your harvest.");h+='<div class="mapwrap"><div class="map"><button class="building shop" data-go="market"><span class="emoji">🏪</span><b>Seed Market</b><small>Buy 5 seed types →</small></button><button class="building green" data-go="greenhouse"><span class="emoji">🏡</span><b>Greenhouse</b><small>10 planting plots →</small></button><span style="position:absolute;left:48%;top:18%;font-size:30px">🌳</span><span style="position:absolute;right:6%;top:40%;font-size:30px">🌲</span><span style="position:absolute;left:38%;bottom:10%;font-size:30px">🌼</span></div></div><div class="cards"><div class="card"><h3>🌱 Getting started</h3><p>You have 2 Carrot Seeds. Plant one and wait for it to grow.</p><button data-go="greenhouse">Go plant</button></div><div class="card"><h3>💰 Make money</h3><p>Harvest crops and sell them from your inventory.</p><button data-go="inventory">Open inventory</button></div></div>';
}else if(game.tab==="market"){h+=head("Seed Market","Buy seeds with cash. Growth times and selling values differ.",'<button data-go="home">← Farm map</button>');h+='<div class="cards">'+crops.map(function(c){return '<div class="card"><div class="emoji">'+c.e+'</div><h3>'+c.name+' Seeds</h3><p class="muted">Grow: '+c.time+' sec · Sell: <b class="price">$'+c.value+'</b><br>In bag: '+game.seeds[c.id]+'</p><button data-buy="'+c.id+'" '+(game.cash<c.price?"disabled":"") +'>Buy 1 · $'+c.price+'</button> <button data-buy5="'+c.id+'" '+(game.cash<c.price*5?"disabled":"") +'>Buy 5 · $'+c.price*5+'</button></div>'}).join("")+'</div>';
}else if(game.tab==="greenhouse"){h+=head("Greenhouse","Plant seeds in ten plots. Timers run in real time.",'<button data-go="market">🛒 Buy seeds</button>');h+='<div class="card"><b>Choose seed:</b><div class="buttons" style="margin-top:8px">'+crops.map(function(c){return '<button data-select="'+c.id+'">'+c.e+' '+c.name+' ('+game.seeds[c.id]+')</button>'}).join("")+'</div></div><div class="plotgrid" style="margin-top:12px">'+game.plots.map(function(p,i){if(!p)return '<div class="plot"><span class="emoji">🟫</span><b>Plot '+(i+1)+'</b><small>Empty soil</small><button data-plant="'+i+'">Plant</button></div>';var c=get(p.id),pct=Math.min(100,(Date.now()-p.at)/1000/c.time*100),ready=pct>=100;return '<div class="plot"><span class="emoji">'+(ready?c.e:"🌱")+'</span><b>Plot '+(i+1)+' · '+c.name+'</b><small>'+(ready?"Ready!":Math.ceil(c.time-(Date.now()-p.at)/1000)+" sec left")+'</small><div style="height:6px;width:100%;background:#082d20"><div style="height:6px;width:'+pct+'%;background:#b9eca2"></div></div><button data-harvest="'+i+'" '+(ready?"":"disabled")+'>'+(ready?"Harvest":"Growing…")+'</button></div>'}).join("")+'</div>';
}else if(game.tab==="inventory"){var worth=crops.reduce(function(a,c){return a+game.harvest[c.id]*c.value},0);h+=head("Inventory","Harvested crops stay here until you sell them.",'<button data-go="greenhouse">Back to plots</button>');h+='<div class="card"><b>🎒 Harvest basket</b><p>Estimated value: <span class="price">$'+worth+'</span></p><button data-sellall '+(sum(game.harvest)?"":"disabled")+'>Sell all crops</button></div>';var list=crops.filter(function(c){return game.harvest[c.id]});h+=list.length?list.map(function(c){return '<div class="row"><span class="emoji">'+c.e+'</span><div class="grow"><b>'+c.name+'</b><p class="muted">'+game.harvest[c.id]+' harvested · $'+c.value+' each</p></div><button data-sell="'+c.id+'">Sell 1 · $'+c.value+'</button><button class="secondary" data-stack="'+c.id+'">Sell all</button></div>'}).join(""):'<p class="muted">Your basket is empty. Plant and harvest crops first.</p>';
}else if(game.tab==="updates"){h+=head("Update Log","Sprout Farm v1.0.0");h+='<div class="row">🟢 <div><b>v1.0.0 — First Farm Build</b><p class="muted">2D top-down map with Seed Market and Greenhouse.</p></div></div><div class="row">🌱 <div><b>Five crops</b><p class="muted">Carrot, Lettuce, Tomato, Corn, and Pumpkin, with unique timers and values.</p></div></div><div class="row">🧺 <div><b>Inventory and selling</b><p class="muted">Harvest crops and sell one or a whole stack.</p></div></div><div class="row">🎨 <div><b>Green gradient UI</b><p class="muted">Responsive interface and automatic browser saving.</p></div></div>';
}else{h+=head("Credits","Thanks for playing the first version.");h+='<div class="cards"><div class="card"><div class="emoji">🌿</div><h3>Game creator</h3><b>Jedi Romero</b><p class="muted">Game concept and direction.</p></div><div class="card"><div class="emoji">🧪</div><h3>Playtester</h3><b>John</b><p class="muted">Try planting, growing, harvesting, and selling. Share bugs and ideas for the next update.</p></div></div>'}
el("panel").innerHTML=h}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.buy){var c=get(b.dataset.buy);if(game.cash>=c.price){game.cash-=c.price;game.seeds[c.id]++;notice="Bought 1 "+c.name+" seed!";save();draw()}return}if(b.dataset.buy5){var c=get(b.dataset.buy5);if(game.cash>=c.price*5){game.cash-=c.price*5;game.seeds[c.id]+=5;notice="Bought 5 "+c.name+" seeds!";save();draw()}return}if(b.dataset.select){selected=b.dataset.select;draw();return}if(b.dataset.plant!==undefined){var i=+b.dataset.plant,c=get(selected);if(game.seeds[c.id]&&!game.plots[i]){game.seeds[c.id]--;game.plots[i]={id:c.id,at:Date.now()};notice=c.name+" planted!";save()}else notice=game.seeds[c.id]?"That plot is occupied.":"You need to buy that seed first.";draw();return}if(b.dataset.harvest!==undefined){var i=+b.dataset.harvest,p=game.plots[i];if(p&&(Date.now()-p.at)/1000>=get(p.id).time){var c=get(p.id);game.harvest[c.id]++;game.plots[i]=null;notice="Harvested "+c.name+"!";save();draw()}return}if(b.dataset.sell){var c=get(b.dataset.sell);if(game.harvest[c.id]){game.harvest[c.id]--;game.cash+=c.value;notice="Sold 1 "+c.name+" for $"+c.value;save();draw()}return}if(b.dataset.stack){var c=get(b.dataset.stack),n=game.harvest[c.id];if(n){game.harvest[c.id]=0;game.cash+=n*c.value;notice="Sold "+n+" "+c.name+" for $"+n*c.value;save();draw()}return}if(b.hasAttribute("data-sellall")){var n=crops.reduce(function(a,c){return a+game.harvest[c.id]*c.value},0);if(n){game.harvest=fresh().harvest;game.cash+=n;notice="Sold your whole harvest for $"+n;save();draw()}}});
setInterval(function(){if(game.tab==="greenhouse")draw()},1000);draw();
</script></body></html>
